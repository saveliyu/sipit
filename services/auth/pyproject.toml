[tool.poetry]
name = "auth-service"
version = "0.1.0"
description = "Auth microservice"
authors = ["saveliyu <uljanoff.sav@yandex.ru>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.14"
fastapi = "^0.141.1"
sqlalchemy = "^2.0.52"
alembic = "^1.19.1"
uvicorn = "^0.52.4"
pydantic-settings = "^2.15.0"
asyncpg = "^0.31.0"
pydantic-extra-types = "^2.11.1"
phonenumbers = "^9.0.38"
pwdlib = {extras = ["argon2"], version = "^0.3.1"}
cryptography = "^50.0.1"
pyjwt = "^2.13.0"
python-multipart = "^0.0.32"
redis = "^8.1.0"


[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-asyncio = "^1.4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


